    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at most 300ms
          - ON for at most 350ms
        then:
          - logger.log: "Button: fan - double"
          - text_sensor.template.publish:
              id: button2_state
              state: "double"
          - homeassistant.event:
              event: esphome.scene_switch_button
              data:
                button: "fan"
                click_type: "double"
          - delay: 1s
          - text_sensor.template.publish:
              id: button2_state
              state: "-"
      - timing:
          - ON for at least 600ms
        then:
          - logger.log: "Button: fan - long"
          - text_sensor.template.publish:
              id: button2_state
              state: "long"
          - homeassistant.event:
              event: esphome.scene_switch_button
              data:
                button: "fan"
                click_type: "long"
          - delay: 1s
          - text_sensor.template.publish:
              id: button2_state
              state: "-"
      - timing:
          - ON for at most 350ms
          - OFF for at least 300ms
        then:
          - logger.log: "Button: fan - single"
          - text_sensor.template.publish:
              id: button2_state
              state: "single"
          - homeassistant.event:
              event: esphome.scene_switch_button
              data:
                button: "fan"
                click_type: "single"
          - delay: 1s
          - text_sensor.template.publish:
              id: button2_state
              state: "-"

  - platform: gpio
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Button 3 - AC"
    id: button_ac
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - script.execute:
          id: click_flash_script
          led_index: 3
    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at most 300ms
          - ON for at most 350ms
        then:
          - logger.log: "Button: ac - double"
          - text_sensor.template.publish:
              id: button3_state
              state: "double"
          - homeassistant.event:
              event: esphome.scene_switch_button
              data:
                button: "ac"
                click_type: "double"
          - delay: 1s
          - text_sensor.template.publish:
              id: button3_state
              state: "-"
      - timing:
          - ON for at least 600ms
        then:
          - logger.log: "Button: ac - long"
          - text_sensor.template.publish:
              id: button3_state
              state: "long"
          - homeassistant.event:
              event: esphome.scene_switch_button
              data:
                button: "ac"
                click_type: "long"
          - delay: 1s
          - text_sensor.template.publish:
              id: button3_state
              state: "-"
      - timing:
          - ON for at most 350ms
          - OFF for at least 300ms
        then:
          - logger.log: "Button: ac - single"
          - text_sensor.template.publish:
              id: button3_state
              state: "single"
          - homeassistant.event:
              event: esphome.scene_switch_button
              data:
                button: "ac"
                click_type: "single"
          - delay: 1s
          - text_sensor.template.publish:
              id: button3_state
              state: "-"

  - platform: gpio
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Button 4 - PC"
    id: button_pc
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - script.execute:
          id: click_flash_script
          led_index: 2
    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at most 300ms
          - ON for at most 350ms
        then:
          - if:
              condition:
